<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absen Mentoring</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8E6;--kartu:#FFFFFF;--teks:#2B2306;--redup:#7A6A3A;--utama:#7A5C00;--lembut:#FFF1C2;--garis:#EAD9A2;--merah:#B42318;--hijau:#1F7A3A;--hijauBg:#DDF3E3;--telat:#B45309;--telatBg:#FDE7C8}
@media (prefers-color-scheme:dark){:root{--bg:#14110A;--kartu:#211C10;--teks:#FFF4D2;--redup:#C2B07A;--utama:#FFD966;--lembut:#2E2713;--garis:#3D341A;--merah:#F97066;--hijau:#6EE7A0;--hijauBg:#12301C;--telat:#FDBA74;--telatBg:#3A2410}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--teks)}
.wadah{max-width:440px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.kartu{background:var(--kartu);border:1px solid var(--garis);border-radius:24px;padding:24px}
.tengah{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.lencana{display:inline-block;background:var(--lembut);color:var(--utama);font-weight:600;font-size:13px;padding:4px 12px;border-radius:999px}
h1{font-size:22px;margin:10px 0 2px;font-weight:800}
h2{font-size:22px;margin:8px 0 0;font-weight:800}
.redup{color:var(--redup);margin:0}
label{display:block;font-weight:600;font-size:14px;margin:18px 0 6px}
input,select{width:100%;height:50px;padding:0 14px;font:inherit;font-size:16px;border:1.5px solid var(--garis);border-radius:14px;background:var(--kartu);color:var(--teks)}
input:focus,select:focus{outline:none;border-color:var(--utama)}
.angka{letter-spacing:8px;font-size:22px;font-weight:800;text-align:center}
.err{color:var(--merah);font-size:13px;margin:6px 0 0}
.err:empty{display:none}
button{width:100%;height:54px;margin-top:22px;border:none;border-radius:16px;background:var(--utama);color:var(--bg);font:inherit;font-size:17px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6}
.foto{display:flex;align-items:center;justify-content:center;height:50px;border:1.5px dashed var(--garis);border-radius:14px;color:var(--redup);margin:0;cursor:pointer}
.sr{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
#pratinjau{width:100%;border-radius:14px;margin-top:10px}
.sisa{text-align:center;color:var(--redup);font-size:13px;margin:12px 0 0}
.putar{width:40px;height:40px;border:4px solid var(--lembut);border-top-color:var(--utama);border-radius:50%;animation:putar 1s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.centang circle{stroke:var(--hijau);stroke-dasharray:227;stroke-dashoffset:227;animation:gores .6s ease-out forwards}
.centang path{stroke:var(--hijau);stroke-dasharray:60;stroke-dashoffset:60;animation:gores .4s .5s ease-out forwards}
@keyframes gores{to{stroke-dashoffset:0}}
.status{padding:6px 16px;border-radius:999px;font-weight:800;background:var(--hijauBg);color:var(--hijau)}
.status.telat{background:var(--telatBg);color:var(--telat)}
.jamHidup{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--utama);margin:12px 0 4px;animation:denyut 2s ease-in-out infinite}
@keyframes denyut{50%{transform:scale(1.04)}}
</style>
</head>
<body>
<main class="wadah">

  <div id="vMuat" class="kartu tengah"><div class="putar"></div><p class="redup">Memeriksa QR…</p></div>

  <div id="vError" class="kartu tengah" hidden>
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--merah)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/></svg>
    <h2 id="eJudul"></h2>
    <p class="redup" id="ePesan"></p>
  </div>

  <form id="vForm" class="kartu" hidden novalidate>
    <span class="lencana" id="fSesi"></span>
    <h1 id="fKegiatan"></h1>
    <p class="redup" id="fTanggal"></p>

    <label for="nama">Nama</label>
    <select id="nama"><option value="">Pilih nama kamu</option></select>
    <p class="err" id="eNama"></p>

    <div id="boxPin">
      <label for="pin">PIN pribadi</label>
      <input id="pin" class="angka" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
      <p class="err" id="ePin"></p>
    </div>

    <label for="kode">Kode di layar mentor</label>
    <input id="kode" class="angka" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000">
    <p class="err" id="eKode"></p>

    <div id="boxSelfie" hidden>
      <label>Selfie di ruangan</label>
      <label class="foto" for="foto"><span id="fotoTeks">Ambil foto</span></label>
      <input id="foto" class="sr" type="file" accept="image/*" capture="user">
      <img id="pratinjau" alt="Pratinjau selfie" hidden>
      <p class="err" id="eSelfie"></p>
    </div>

    <p class="err" id="eUmum"></p>
    <button id="bKirim">Saya hadir</button>
    <p class="sisa" id="sisa"></p>
  </form>

  <div id="vSukses" class="kartu tengah" hidden>
    <svg class="centang" width="88" height="88" viewBox="0 0 88 88" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="44" cy="44" r="36"/><path d="M28 45l11 11 21-22"/></svg>
    <h2 id="sNama"></h2>
    <span class="status" id="sStatus"></span>
    <div class="jamHidup" id="sJamHidup"></div>
    <p class="redup">Tercatat pukul <b id="sJam"></b> · Sesi <b id="sSesi"></b></p>
    <p class="redup" style="font-size:13px;margin-top:10px">Tunjukkan layar ini kalau mentor meminta.</p>
  </div>

</main>
<script>
// URL web app Apps Script (berakhiran /exec). Ganti kalau deployment-nya berubah.
const API = 'https://script.google.com/macros/s/AKfycbwnVLeX8jROYZJhlq6xcF6gs4eVfLU0QScHcLvimfxLtvkepTOClxp9L53dCqNPEibzGg/exec';

const $ = id => document.getElementById(id);
const TOKEN = new URLSearchParams(location.search).get('t') || '';
let INFO = null, foto = '', batasAkhir = 0, timer = null;

// Kirim ke Apps Script tanpa membawa akun Google (anti error /u/1/).
async function api(aksi, isi) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ aksi: aksi }, isi)),
    credentials: 'omit',
    redirect: 'follow'
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function tampil(id) { ['vMuat', 'vError', 'vForm', 'vSukses'].forEach(x => $(x).hidden = x !== id); }
function gagal(judul, pesan) { clearInterval(timer); $('eJudul').textContent = judul; $('ePesan').textContent = pesan; tampil('vError'); }
function simpan(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function ambil(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function idPerangkat() {
  let id = ambil('absenPerangkat');
  if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36); simpan('absenPerangkat', id); }
  return ambil('absenPerangkat') || id;
}
function bersih() { ['eNama', 'ePin', 'eKode', 'eSelfie', 'eUmum'].forEach(x => $(x).textContent = ''); }
function r_pin() { return !(INFO && INFO.pin === false); }
function salah(id, pesan) { $(id).textContent = pesan; }

api('mulai', { token: TOKEN })
  .then(mulai)
  .catch(() => gagal('Gagal memuat', 'Periksa koneksi internet, lalu scan ulang QR di layar.'));

function mulai(r) {
  if (!r.ok) {
    const judul = { tutup: 'Sesi belum dibuka', kosong: 'Scan QR dulu', kedaluwarsa: 'QR sudah kedaluwarsa' }[r.alasan];
    return gagal(judul || 'Tidak bisa absen', r.pesan);
  }
  INFO = r;
  $('fSesi').textContent = 'Sesi ' + r.sesi + (r.topik ? ' · ' + r.topik : '');
  $('fKegiatan').textContent = r.kegiatan;
  document.title = 'Absen ' + r.kegiatan;
  $('fTanggal').textContent = new Date().toLocaleDateString('id-ID',
    { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  r.peserta.forEach(p => $('nama').add(new Option(p.nama, p.nim)));
  $('nama').value = ambil('absenNim');
  $('boxPin').hidden = r.pin === false;
  $('boxSelfie').hidden = !r.selfie;
  batasAkhir = Date.now() + r.batasMenit * 60000;
  timer = setInterval(hitungMundur, 1000);
  hitungMundur();
  tampil('vForm');
}

function hitungMundur() {
  const s = Math.max(0, Math.round((batasAkhir - Date.now()) / 1000));
  $('sisa').textContent = 'Sisa waktu mengisi ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  if (s === 0) gagal('Waktu habis', 'Scan ulang QR di layar mentor untuk absen.');
}

['pin', 'kode'].forEach(id => $(id).addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
  bersih();
}));
$('nama').addEventListener('change', bersih);

$('foto').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 640 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k);
    c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    foto = c.toDataURL('image/jpeg', 0.7);
    $('pratinjau').src = foto;
    $('pratinjau').hidden = false;
    $('fotoTeks').textContent = 'Ganti foto';
    $('eSelfie').textContent = '';
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
});

$('vForm').addEventListener('submit', e => {
  e.preventDefault();
  bersih();
  const d = {
    tiket: INFO.tiket, terbit: INFO.terbit, nim: $('nama').value,
    pin: $('pin').value, kode: $('kode').value, perangkat: idPerangkat(), selfie: foto
  };
  if (!d.nim) return salah('eNama', 'Pilih nama kamu dulu.');
  if (r_pin() && d.pin.length !== 4) return salah('ePin', 'PIN terdiri dari 4 angka.');
  if (d.kode.length !== 4) return salah('eKode', 'Kode terdiri dari 4 angka.');
  if (INFO.selfie && !foto) return salah('eSelfie', 'Ambil selfie dulu.');

  const b = $('bKirim');
  b.disabled = true;
  b.textContent = 'Mengirim…';
  const pulih = () => { b.disabled = false; b.textContent = 'Saya hadir'; };
  api('kirim', { data: d })
    .then(r => {
      pulih();
      if (!r.ok) return salah({ pin: 'ePin', kode: 'eKode', selfie: 'eSelfie' }[r.kolom] || 'eUmum', r.pesan);
      simpan('absenNim', d.nim);
      sukses(r);
    })
    .catch(() => { pulih(); salah('eUmum', 'Gagal mengirim. Periksa internet lalu coba lagi.'); });
});

function sukses(r) {
  clearInterval(timer);
  $('sNama').textContent = r.nama;
  $('sStatus').textContent = r.status;
  $('sStatus').classList.toggle('telat', r.status === 'Terlambat');
  $('sJam').textContent = r.jam;
  $('sSesi').textContent = r.sesi;
  const jalan = () => $('sJamHidup').textContent = new Date().toLocaleTimeString('id-ID', { hour12: false });
  jalan();
  setInterval(jalan, 1000);
  tampil('vSukses');
}
</script>
</body>
</html>
